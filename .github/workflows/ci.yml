name: SAKRE CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality-check:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Cache Bun dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Materialize the pinned native tools for real-tool tests
              run: bun scripts/verify-native-assets.ts --target linux-x64 --expose-dir "$RUNNER_TEMP/native-tools"

            - name: Oxfmt Format Check
              run: bun run format:check

            - name: Oxlint
              run: bun run lint

            - name: TypeScript Typecheck
              run: bun run typecheck

            - name: Unit, security and Action delivery tests
              env:
                  SAKRE_SCC_BINARY: ${{ runner.temp }}/native-tools/scc
                  SAKRE_CCCC_BINARY: ${{ runner.temp }}/native-tools/cccc
              run: bun run test

    build-artifacts:
        needs: quality-check
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: linux-x64
                      runner: ubuntu-22.04
                      artifact: sakre-linux-x64
                    - target: linux-arm64
                      runner: ubuntu-22.04-arm
                      artifact: sakre-linux-arm64
                    # macos-15-intel is the current GitHub-hosted Intel macOS label
                    # for public and private repositories. macos-13 was retired and
                    # jobs on its label stay queued forever. Evidence:
                    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
                    - target: darwin-x64
                      runner: macos-15-intel
                      artifact: sakre-darwin-x64
                    - target: darwin-arm64
                      runner: macos-latest
                      artifact: sakre-darwin-arm64
                    - target: windows-x64
                      runner: windows-latest
                      artifact: sakre-windows-x64.exe
        runs-on: ${{ matrix.runner }}
        # Every artifact leg is a required PR gate: a broken build, embedding or
        # resolver must fail the run instead of surfacing first at release time.
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Cache Bun dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Verify pinned native assets and expose the tools
              shell: bash
              run: bun scripts/verify-native-assets.ts --target ${{ matrix.target }} --expose-dir "$RUNNER_TEMP/native-tools"

            - name: Prove the pinned SCC and CCCC execute natively
              shell: bash
              env:
                  SAKRE_SCC_BINARY: ${{ runner.temp }}/native-tools/scc
                  SAKRE_CCCC_BINARY: ${{ runner.temp }}/native-tools/cccc
              run: bun test tests/intelligence

            - name: Build standalone engine
              run: bun scripts/build-release.ts --target ${{ matrix.target }}

            - name: Run artifact tests
              if: ${{ !startsWith(matrix.target, 'linux-') }}
              shell: bash
              env:
                  SAKRE_ENGINE_BINARY: ${{ github.workspace }}/dist-release/${{ matrix.artifact }}
              run: bun test tests/artifact tests/integration

            - name: Create Linux binary checksum
              if: ${{ startsWith(matrix.target, 'linux-') }}
              shell: bash
              run: cd dist-release && sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

            - name: Upload Linux artifact for compatibility tests
              if: ${{ startsWith(matrix.target, 'linux-') }}
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: ${{ matrix.artifact }}
                  path: |
                      dist-release/${{ matrix.artifact }}
                      dist-release/${{ matrix.artifact }}.gz
                      dist-release/${{ matrix.artifact }}.sha256
                  if-no-files-found: error

            # The PowerShell resolver only exists on Windows, so its tests run
            # in the native Windows job instead of the Linux quality gate.
            - name: Run Action resolver tests
              if: runner.os == 'Windows'
              shell: bash
              run: bun test tests/action

            - name: Upload non-Linux artifact
              if: ${{ !startsWith(matrix.target, 'linux-') }}
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: ${{ matrix.artifact }}
                  path: dist-release/${{ matrix.artifact }}.gz
                  if-no-files-found: error

    test-linux-compatibility:
        needs: build-artifacts
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-22.04
                      artifact: sakre-linux-x64
                      experimental: false
                    - runner: ubuntu-24.04
                      artifact: sakre-linux-x64
                      experimental: false
                    - runner: ubuntu-26.04
                      artifact: sakre-linux-x64
                      experimental: true
                    - runner: ubuntu-22.04-arm
                      artifact: sakre-linux-arm64
                      experimental: false
                    - runner: ubuntu-24.04-arm
                      artifact: sakre-linux-arm64
                      experimental: false
                    - runner: ubuntu-26.04-arm
                      artifact: sakre-linux-arm64
                      experimental: true
        runs-on: ${{ matrix.runner }}
        continue-on-error: ${{ matrix.experimental }}
        timeout-minutes: 60
        env:
            SAKRE_ENGINE_BINARY: ${{ github.workspace }}/dist-release/${{ matrix.artifact }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Download the Ubuntu 22.04 build artifact
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: ${{ matrix.artifact }}
                  path: dist-release

            - name: Verify downloaded binary identity
              shell: bash
              run: |
                  chmod +x "$SAKRE_ENGINE_BINARY"
                  (cd dist-release && sha256sum --check "${{ matrix.artifact }}.sha256")

            - name: Report shared-library requirements
              shell: bash
              run: |
                  ldd "$SAKRE_ENGINE_BINARY" | tee "$RUNNER_TEMP/sakre-ldd.txt"
                  if grep -q 'not found' "$RUNNER_TEMP/sakre-ldd.txt"; then
                      echo 'A required Linux shared library is missing.' >&2
                      exit 1
                  fi

            - name: Smoke-test the downloaded binary
              shell: bash
              run: >-
                  "$SAKRE_ENGINE_BINARY" --version

            - name: Install test dependencies
              run: bun install --frozen-lockfile

            - name: Run artifact and integration tests against the downloaded binary
              run: bun test tests/artifact tests/integration
