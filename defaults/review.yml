# Production defaults embedded in the Action release.
# A repository can extend them via its review config file (read at the base SHA).
# Workflow operational inputs have final priority.
provider: anthropic
review:
    failurePolicy: continue-partial
    deadlineMinutes: 15
    diffBudgetChars: 80000
# Model routing is an (agent, tier) matrix. Resolution order per active agent:
#   models.routing[agent][tier] -> models.routing[agent].default -> model -> fail closed.
# The optional models.catalog carries per-model metadata and must reference the
# routed ids. The built-in `tests` specialist has no default cell and resolves
# through the same chain as every other agent (mirroring `correctness`), so a
# repository can tune it later with models.routing.tests. Example:
#   models:
#       catalog:
#           kimi-k2.6:
#               artificialAnalysisUrl: https://artificialanalysis.ai/models/kimi-k2-6
#       routing:
#           coordinator: { lite: minimax-m3, standard: qwen3.7-max, hard: qwen3.7-max }
#           security: { hard: deepseek-v4-pro }
# Tier -> built-in agents policy. Hard runs every specialist systematically;
# lite and standard add signal-driven specialists on top of their base policy
# and declarative roles always run; all are applied by the pipeline. The proof
# specialist `tests` is part of every tier and is not gated on test files changing.
# Lifecycle roles (`coordinator`, `verifier`) run on every tier.
agents:
    plan:
        lite:
            - correctness
            - tests
            - coordinator
            - verifier
        standard:
            - correctness
            - conventions
            - maintainability
            - tests
            - coordinator
            - verifier
        hard:
            - correctness
            - security
            - performance
            - conventions
            - maintainability
            - tests
            - coordinator
            - verifier

# Repository/file classification: the single owner of path classes, generated
# markers and derived analysis policy. Risk, the ReviewMap, SCC/CCCC input
# planning and diff metadata consume these rules; no other module re-encodes
# lockfile, vendor or generated patterns.
classification:
    lockfilePatterns:
        - bun.lock
        - '**/bun.lock'
        - package-lock.json
        - '**/package-lock.json'
        - pnpm-lock.yaml
        - '**/pnpm-lock.yaml'
        - yarn.lock
        - '**/yarn.lock'
        - Cargo.lock
        - '**/Cargo.lock'
        - go.sum
        - '**/go.sum'
        - Pipfile.lock
        - '**/Pipfile.lock'
        - poetry.lock
        - '**/poetry.lock'
        - flake.lock
        - '**/flake.lock'
    vendorPatterns:
        - '**/vendor/**'
        - '**/node_modules/**'
        - '**/third_party/**'
        - '**/third-party/**'
    assetPatterns:
        - '**/*.png'
        - '**/*.jpg'
        - '**/*.jpeg'
        - '**/*.gif'
        - '**/*.webp'
        - '**/*.ico'
        - '**/*.icns'
        - '**/*.svg'
        - '**/*.woff'
        - '**/*.woff2'
        - '**/*.ttf'
        - '**/*.otf'
        - '**/*.eot'
        - '**/*.mp3'
        - '**/*.mp4'
        - '**/*.webm'
        - '**/*.mov'
        - '**/*.pdf'
        - '**/*.zip'
        - '**/*.gz'
        - '**/*.tgz'
        - '**/*.tar'
        - '**/*.7z'
        - '**/*.exe'
        - '**/*.dll'
        - '**/*.so'
        - '**/*.dylib'
        - '**/*.wasm'
        - '**/*.bin'
    generatedPathPatterns:
        - '**/*.map'
        - '**/*.min.js'
        - '**/*.min.css'
        - '**/*.bundle.js'
    generatedMarkers:
        - '@generated'
        - Generated by
        - Code generated
    generatedExceptions:
        - '**/migrations/**'
        - '**/*.sql'
    docsPatterns:
        - '**/*.md'
        - '**/*.mdx'
        - docs/**
        - '**/docs/**'
        - LICENSE
        - '**/LICENSE'
        - CHANGELOG
        - '**/CHANGELOG'
    testPatterns:
        - '**/*.test.*'
        - '**/*.spec.*'
        - '**/__tests__/**'
        - '**/tests/**'
        - '**/fixtures/**'
    configPatterns:
        - '**/*.yml'
        - '**/*.yaml'
        - '**/*.json'
        - '**/*.toml'
        - '**/*.ini'
        - '**/*.cfg'
        - '**/*.conf'
        - .github/**
        - '**/Dockerfile'
        - '**/Makefile'
        - '**/.env*'
    dependencyManifestPatterns:
        - '**/package.json'
        - '**/bun.lock'
        - '**/package-lock.json'
        - '**/pnpm-lock.yaml'
        - '**/yarn.lock'
        - '**/go.mod'
        - '**/Cargo.toml'
        - '**/requirements*.txt'
        - '**/pom.xml'
        - '**/build.gradle.kts'
        - '**/Gemfile'
        - '**/composer.json'
        - '**/pyproject.toml'
        - '**/*.csproj'
    criticalPathPatterns:
        - '**/auth/**'
        - '**/security/**'
        - '**/middleware/**'
        - '**/*.sql'
        - '**/migrations/**'
    securityPathPatterns:
        - '**/auth/**'
        - '**/security/**'
        - '**/middleware/**'
        - '**/*token*'
        - '**/*permission*'
        - '**/*oauth*'
        - '**/*secret*'
        - '**/*credential*'
        - '**/*crypto*'
    performancePathPatterns:
        - 'back/**'
        - 'api/**'
        - 'server/**'
        - 'worker/**'
        - 'jobs/**'
        - '**/*query*'
        - '**/*repository*'
        - '**/*.sql'
    conventionPathPatterns:
        - AGENTS.md
        - .github/workflows/**
        - README.md
        - docs/**
        - package.json
        - tsconfig.json
        - Makefile
        - docker-compose*.yml
        - '**/.env.example'
tools:
    context7:
        enabled: false
    web:
        enabled: false
