name: Engine delivery benchmark

# Manual measurement only: the deterministic pre-pass benchmark and the
# composite Action delivery benchmark run on workflow_dispatch. Pull requests
# are protected by the mandatory ci.yml correctness gates instead (real SCC and
# CCCC execution, deterministic pre-pass, hostile inputs, the large-tree
# regression, and the five native artifact legs). This workflow remains the
# reproducible way to re-measure tool times, JSON sizes, RSS, parse/build cost,
# sequential-vs-concurrent execution, projection sizes, and delivery overhead.
#
# The delivery matrix publishes a temporary prerelease with the engine it just
# built so the resolver downloads a real release asset, then deletes the release
# and its tag. Nothing is published permanently and no existing tag is touched.

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: engine-delivery-benchmark
    cancel-in-progress: false

jobs:
    # Manual pre-pass measurement: real repository, synthetic 200/2,000/10,000-
    # file trees, JSON sizes, child RSS, parse and ReviewMap build costs,
    # projection sizes, and sequential vs concurrent execution.
    intelligence:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # The benchmark compares HEAD with HEAD~1.
                  fetch-depth: 0

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Cache Bun dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Materialize the pinned native tools
              run: bun scripts/verify-native-assets.ts --target linux-x64 --expose-dir "$RUNNER_TEMP/intelligence-tools"

            - name: Measure the deterministic pre-pass
              env:
                  SAKRE_SCC_BINARY: ${{ runner.temp }}/intelligence-tools/scc
                  SAKRE_CCCC_BINARY: ${{ runner.temp }}/intelligence-tools/cccc
              run: |
                  set -o pipefail
                  bun scripts/benchmark-intelligence.ts --base HEAD~1 --head HEAD --runs 10 | tee "$GITHUB_STEP_SUMMARY"

    measure:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-24.04
                      target: linux-x64
                      artifact: sakre-linux-x64
                    - os: macos-latest
                      target: darwin-arm64
                      artifact: sakre-darwin-arm64
                    - os: windows-latest
                      target: windows-x64
                      artifact: sakre-windows-x64.exe
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        env:
            BENCHMARK_TAG: benchmark-${{ github.run_id }}-${{ matrix.target }}
            # The benchmark release belongs to this repository; the engine token
            # fallback makes the authenticated asset download work when the
            # repository is private. The target-repository token is not used.
            SAKRE_ENGINE_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Cache Bun dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Verify pinned native assets
              run: bun scripts/verify-native-assets.ts --target ${{ matrix.target }}

            - name: Build the standalone engine
              run: bun scripts/build-release.ts --target ${{ matrix.target }}

            - name: Publish the temporary benchmark prerelease
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$BENCHMARK_TAG" "dist-release/${{ matrix.artifact }}.gz" \
                    --prerelease \
                    --target "$GITHUB_SHA" \
                    --title "$BENCHMARK_TAG" \
                    --notes "Temporary engine delivery benchmark release. Created and deleted by .github/workflows/benchmark.yml."

            - name: Measure bootstrap, direct download and cold start
              shell: bash
              run: bun scripts/benchmark-action.ts --tag "$BENCHMARK_TAG" --artifact "dist-release/${{ matrix.artifact }}"

            - name: Mark the cache miss restore start
              shell: bash
              run: echo "CACHE_MISS_START_MS=$(perl -MTime::HiRes=time -e 'printf "%.0f", time * 1000')" >> "$GITHUB_ENV"

            - name: Restore a key that was never saved
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: benchmark-cache-miss
                  key: sakre-engine-miss-${{ matrix.os }}-${{ github.run_id }}
                  fail-on-cache-miss: false

            - name: Record the cache miss time
              shell: bash
              run: |
                  end=$(perl -MTime::HiRes=time -e 'printf "%.0f", time * 1000')
                  echo "| actions/cache/restore (never-saved key) | $((end - CACHE_MISS_START_MS)) |" >> "$GITHUB_STEP_SUMMARY"

            - name: Save the staged engine to the Actions cache
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: benchmark-cache
                  key: sakre-engine-${{ matrix.os }}-${{ github.run_id }}

            - name: Delete the temporary benchmark prerelease
              if: always()
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release delete "$BENCHMARK_TAG" --cleanup-tag --yes

    cache-restore:
        needs: measure
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-24.04
                    - os: macos-latest
                    - os: windows-latest
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        steps:
            - name: Mark the cache restore start
              shell: bash
              run: echo "CACHE_RESTORE_START_MS=$(perl -MTime::HiRes=time -e 'printf "%.0f", time * 1000')" >> "$GITHUB_ENV"

            - name: Restore the staged engine from the Actions cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: benchmark-cache
                  key: sakre-engine-${{ matrix.os }}-${{ github.run_id }}
                  fail-on-cache-miss: true

            - name: Record the restore time and cold-start the restored engine
              shell: bash
              run: |
                  restore_end=$(perl -MTime::HiRes=time -e 'printf "%.0f", time * 1000')
                  binary=$(find benchmark-cache -type f | head -n 1)
                  start=$(perl -MTime::HiRes=time -e 'printf "%.0f", time * 1000')
                  version=$("$binary" --version)
                  end=$(perl -MTime::HiRes=time -e 'printf "%.0f", time * 1000')
                  {
                      echo '### SAKRE engine delivery cache measurement'
                      echo ''
                      echo '| Measurement | ms |'
                      echo '| --- | ---: |'
                      echo "| actions/cache/restore (hit) | $((restore_end - CACHE_RESTORE_START_MS)) |"
                      echo "| restored binary \`--version\` | $((end - start)) |"
                      echo ''
                      echo "Restored \`$binary\` (${version})."
                  } >> "$GITHUB_STEP_SUMMARY"
